name: Validate POC

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Fetch and verify ODCS v3.2.0 schema
        run: .venv/bin/python scripts/fetch_odcs_schema.py
      - name: Verify compiled Lakeflow rules
        run: .venv/bin/python scripts/compile_contracts.py --check
      - name: Run tests
        run: .venv/bin/pytest
      - name: Lint
        run: .venv/bin/ruff check .
