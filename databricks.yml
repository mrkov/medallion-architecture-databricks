bundle:
  name: medallion-architecture-poc-v2

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog used by the POC.
    default: main
  volume_name:
    description: Unity Catalog volume used for arriving source files.
    default: landing
  pipeline_channel:
    description: Lakeflow Declarative Pipelines runtime channel.
    default: CURRENT
  gold_trigger_status:
    description: UNPAUSED for automatic refresh; pause when rerunning setup. Bootstrap omits the trigger entirely.
    default: UNPAUSED

sync:
  include:
    - contracts/**/*.yaml
    - src/**/*.py
    - resources/*.yml
    - tests/**/*.py
    - demo/**/*.yaml

targets:
  dev:
    mode: development
    default: true
    presets:
      trigger_pause_status: UNPAUSED
  prod:
    mode: production

