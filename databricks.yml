bundle:
  name: medallion-architecture-poc

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog used by the POC.
    default: main
  schema_prefix:
    description: Prefix for Bronze, Silver, Gold, and domain-specific Platinum mart schemas.
    default: medallion_poc
  volume_name:
    description: Unity Catalog volume used for arriving source files.
    default: landing
  pipeline_channel:
    description: Lakeflow Declarative Pipelines runtime channel.
    default: CURRENT

sync:
  include:
    - contracts/**/*.yaml
    - src/**/*.py
    - resources/*.yml
    - tests/**/*.py

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production

