resources:
  pipelines:
    erp_source_pipeline:
      name: "[${bundle.target}] ERP Bronze to Silver"
      catalog: ${var.catalog}
      target: ${var.schema_prefix}_bronze
      channel: ${var.pipeline_channel}
      serverless: true
      continuous: false
      photon: true
      environment:
        dependencies:
          - open-data-contract-standard==3.2.0
      libraries:
        - glob:
            include: ../src/pipelines/erp/**
      configuration:
        poc.bundle_root: ${workspace.file_path}
        poc.catalog: ${var.catalog}
        poc.schema_prefix: ${var.schema_prefix}
        poc.volume_name: ${var.volume_name}

    crm_source_pipeline:
      name: "[${bundle.target}] CRM Bronze to Silver"
      catalog: ${var.catalog}
      target: ${var.schema_prefix}_bronze
      channel: ${var.pipeline_channel}
      serverless: true
      continuous: false
      photon: true
      environment:
        dependencies:
          - open-data-contract-standard==3.2.0
      libraries:
        - glob:
            include: ../src/pipelines/crm/**
      configuration:
        poc.bundle_root: ${workspace.file_path}
        poc.catalog: ${var.catalog}
        poc.schema_prefix: ${var.schema_prefix}
        poc.volume_name: ${var.volume_name}

    ads_source_pipeline:
      name: "[${bundle.target}] Ads Bronze to Silver"
      catalog: ${var.catalog}
      target: ${var.schema_prefix}_bronze
      channel: ${var.pipeline_channel}
      serverless: true
      continuous: false
      photon: true
      environment:
        dependencies:
          - open-data-contract-standard==3.2.0
      libraries:
        - glob:
            include: ../src/pipelines/ads/**
      configuration:
        poc.bundle_root: ${workspace.file_path}
        poc.catalog: ${var.catalog}
        poc.schema_prefix: ${var.schema_prefix}
        poc.volume_name: ${var.volume_name}

    gold_pipeline:
      name: "[${bundle.target}] Silver to Gold"
      catalog: ${var.catalog}
      target: ${var.schema_prefix}_gold
      channel: ${var.pipeline_channel}
      serverless: true
      continuous: false
      photon: true
      environment:
        dependencies:
          - open-data-contract-standard==3.2.0
      libraries:
        - file:
            path: ../src/pipelines/gold.py
      configuration:
        poc.bundle_root: ${workspace.file_path}
        poc.catalog: ${var.catalog}
        poc.schema_prefix: ${var.schema_prefix}
        poc.volume_name: ${var.volume_name}

    platinum_pipeline:
      name: "[${bundle.target}] Gold to Platinum Sales and Marketing marts"
      catalog: ${var.catalog}
      # Preserve the existing pipeline namespace; outputs explicitly use Platinum mart schemas.
      target: ${var.schema_prefix}_platinum
      channel: ${var.pipeline_channel}
      serverless: true
      continuous: false
      photon: true
      environment:
        dependencies:
          - open-data-contract-standard==3.2.0
      libraries:
        - file:
            path: ../src/pipelines/platinum.py
      configuration:
        poc.bundle_root: ${workspace.file_path}
        poc.catalog: ${var.catalog}
        poc.schema_prefix: ${var.schema_prefix}
        poc.volume_name: ${var.volume_name}

  jobs:
    setup_poc:
      name: "[${bundle.target}] Set up POC storage and source interfaces"
      tasks:
        - task_key: initialize
          run_job_task:
            job_id: ${resources.jobs.initialize_source_interfaces.id}

    curated_refresh:
      name: "[${bundle.target}] Refresh Gold and Platinum"
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
        - task_key: refresh_gold
          pipeline_task:
            pipeline_id: ${resources.pipelines.gold_pipeline.id}
        - task_key: refresh_platinum
          depends_on:
            - task_key: publish_dimension_views
          pipeline_task:
            pipeline_id: ${resources.pipelines.platinum_pipeline.id}
        - task_key: publish_dimension_views
          depends_on:
            - task_key: refresh_gold
          notebook_task:
            notebook_path: ../src/notebooks/demo_control.py
            base_parameters:
              action: publish_views
              catalog: ${var.catalog}
              schema_prefix: ${var.schema_prefix}
              volume_name: ${var.volume_name}

    ingest_erp:
      name: "[${bundle.target}] Ingest ERP then refresh curated layers"
      tasks:
        - task_key: prepare_storage
          notebook_task:
            notebook_path: ../src/notebooks/setup_poc.py
            base_parameters:
              bundle_root: ${workspace.file_path}
              catalog: ${var.catalog}
              schema_prefix: ${var.schema_prefix}
              volume_name: ${var.volume_name}
        - task_key: ingest_erp
          depends_on:
            - task_key: prepare_storage
          pipeline_task:
            pipeline_id: ${resources.pipelines.erp_source_pipeline.id}
        - task_key: refresh_curated_layers
          depends_on:
            - task_key: ingest_erp
          run_job_task:
            job_id: ${resources.jobs.curated_refresh.id}

    ingest_crm:
      name: "[${bundle.target}] Ingest CRM then refresh curated layers"
      tasks:
        - task_key: prepare_storage
          notebook_task:
            notebook_path: ../src/notebooks/setup_poc.py
            base_parameters:
              bundle_root: ${workspace.file_path}
              catalog: ${var.catalog}
              schema_prefix: ${var.schema_prefix}
              volume_name: ${var.volume_name}
        - task_key: ingest_crm
          depends_on:
            - task_key: prepare_storage
          pipeline_task:
            pipeline_id: ${resources.pipelines.crm_source_pipeline.id}
        - task_key: refresh_curated_layers
          depends_on:
            - task_key: ingest_crm
          run_job_task:
            job_id: ${resources.jobs.curated_refresh.id}

    ingest_ads:
      name: "[${bundle.target}] Ingest Ads then refresh curated layers"
      tasks:
        - task_key: prepare_storage
          notebook_task:
            notebook_path: ../src/notebooks/setup_poc.py
            base_parameters:
              bundle_root: ${workspace.file_path}
              catalog: ${var.catalog}
              schema_prefix: ${var.schema_prefix}
              volume_name: ${var.volume_name}
        - task_key: ingest_ads
          depends_on:
            - task_key: prepare_storage
          pipeline_task:
            pipeline_id: ${resources.pipelines.ads_source_pipeline.id}
        - task_key: refresh_curated_layers
          depends_on:
            - task_key: ingest_ads
          run_job_task:
            job_id: ${resources.jobs.curated_refresh.id}

    initialize_source_interfaces:
      name: "[${bundle.target}] Initialize source interfaces"
      tasks:
        - task_key: prepare_storage
          notebook_task:
            notebook_path: ../src/notebooks/setup_poc.py
            base_parameters:
              bundle_root: ${workspace.file_path}
              catalog: ${var.catalog}
              schema_prefix: ${var.schema_prefix}
              volume_name: ${var.volume_name}
        - task_key: initialize_erp
          depends_on:
            - task_key: prepare_storage
          pipeline_task:
            pipeline_id: ${resources.pipelines.erp_source_pipeline.id}
        - task_key: initialize_crm
          depends_on:
            - task_key: prepare_storage
          pipeline_task:
            pipeline_id: ${resources.pipelines.crm_source_pipeline.id}
        - task_key: initialize_ads
          depends_on:
            - task_key: prepare_storage
          pipeline_task:
            pipeline_id: ${resources.pipelines.ads_source_pipeline.id}

    medallion_poc_demo:
      name: "[${bundle.target}] Four-layer POC staged-arrival demo"
      tasks:
        - task_key: seed_erp
          notebook_task:
            notebook_path: ../src/notebooks/demo_control.py
            base_parameters:
              action: seed_erp
              catalog: ${var.catalog}
              schema_prefix: ${var.schema_prefix}
              volume_name: ${var.volume_name}
        - task_key: process_erp
          depends_on:
            - task_key: seed_erp
          pipeline_task:
            pipeline_id: ${resources.pipelines.erp_source_pipeline.id}
            full_refresh: true
        - task_key: initialize_empty_crm
          depends_on:
            - task_key: seed_erp
          pipeline_task:
            pipeline_id: ${resources.pipelines.crm_source_pipeline.id}
            full_refresh: true
        - task_key: initialize_empty_ads
          depends_on:
            - task_key: seed_erp
          pipeline_task:
            pipeline_id: ${resources.pipelines.ads_source_pipeline.id}
            full_refresh: true
        - task_key: gold_after_erp
          depends_on:
            - task_key: process_erp
            - task_key: initialize_empty_crm
            - task_key: initialize_empty_ads
          pipeline_task:
            pipeline_id: ${resources.pipelines.gold_pipeline.id}
            full_refresh: true
        - task_key: platinum_after_erp
          depends_on:
            - task_key: publish_views
          pipeline_task:
            pipeline_id: ${resources.pipelines.platinum_pipeline.id}
            full_refresh: true
        - task_key: publish_views
          depends_on:
            - task_key: gold_after_erp
          notebook_task:
            notebook_path: ../src/notebooks/demo_control.py
            base_parameters:
              action: publish_views
              catalog: ${var.catalog}
              schema_prefix: ${var.schema_prefix}
              volume_name: ${var.volume_name}
        - task_key: assert_erp_only
          depends_on:
            - task_key: platinum_after_erp
          notebook_task:
            notebook_path: ../src/notebooks/demo_control.py
            base_parameters:
              action: assert_erp_only
              catalog: ${var.catalog}
              schema_prefix: ${var.schema_prefix}
              volume_name: ${var.volume_name}
        - task_key: seed_crm
          depends_on:
            - task_key: assert_erp_only
          notebook_task:
            notebook_path: ../src/notebooks/demo_control.py
            base_parameters:
              action: seed_crm
              catalog: ${var.catalog}
              schema_prefix: ${var.schema_prefix}
              volume_name: ${var.volume_name}
        - task_key: process_crm
          depends_on:
            - task_key: seed_crm
          pipeline_task:
            pipeline_id: ${resources.pipelines.crm_source_pipeline.id}
        - task_key: gold_after_crm
          depends_on:
            - task_key: process_crm
          pipeline_task:
            pipeline_id: ${resources.pipelines.gold_pipeline.id}
        - task_key: platinum_after_crm
          depends_on:
            - task_key: gold_after_crm
          pipeline_task:
            pipeline_id: ${resources.pipelines.platinum_pipeline.id}
        - task_key: assert_crm_enriched
          depends_on:
            - task_key: platinum_after_crm
          notebook_task:
            notebook_path: ../src/notebooks/demo_control.py
            base_parameters:
              action: assert_crm_enriched
              catalog: ${var.catalog}
              schema_prefix: ${var.schema_prefix}
              volume_name: ${var.volume_name}
        - task_key: seed_ads
          depends_on:
            - task_key: assert_crm_enriched
          notebook_task:
            notebook_path: ../src/notebooks/demo_control.py
            base_parameters:
              action: seed_ads
              catalog: ${var.catalog}
              schema_prefix: ${var.schema_prefix}
              volume_name: ${var.volume_name}
        - task_key: process_ads
          depends_on:
            - task_key: seed_ads
          pipeline_task:
            pipeline_id: ${resources.pipelines.ads_source_pipeline.id}
        - task_key: gold_after_ads
          depends_on:
            - task_key: process_ads
          pipeline_task:
            pipeline_id: ${resources.pipelines.gold_pipeline.id}
        - task_key: platinum_after_ads
          depends_on:
            - task_key: gold_after_ads
          pipeline_task:
            pipeline_id: ${resources.pipelines.platinum_pipeline.id}
        - task_key: assert_complete
          depends_on:
            - task_key: platinum_after_ads
          notebook_task:
            notebook_path: ../src/notebooks/demo_control.py
            base_parameters:
              action: assert_complete
              catalog: ${var.catalog}
              schema_prefix: ${var.schema_prefix}
              volume_name: ${var.volume_name}
