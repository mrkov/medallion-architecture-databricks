            catalog: ${var.catalog}
            volume_name: ${var.volume_name}
            action: wait
            stage: erp
            scenario: scenario
        depends_on:
        - task_key: ingest_erp
      - task_key: seed_crm
        notebook_task:
          notebook_path: ../src/notebooks/demo_arrivals.py
          base_parameters:
            bundle_root: ${workspace.file_path}
            catalog: ${var.catalog}
            volume_name: ${var.volume_name}
            action: seed
            stage: crm
            scenario: scenario
        depends_on:
        - task_key: observe_erp
      - task_key: ingest_crm
        run_job_task:
          job_id: ${resources.jobs.ingest_crm.id}
        depends_on:
        - task_key: seed_crm
      - task_key: observe_crm
        notebook_task:
          notebook_path: ../src/notebooks/demo_arrivals.py
          base_parameters:
            bundle_root: ${workspace.file_path}
            catalog: ${var.catalog}
            volume_name: ${var.volume_name}
            action: wait
            stage: crm
            scenario: scenario
        depends_on:
        - task_key: ingest_crm
      - task_key: seed_ads
        notebook_task:
          notebook_path: ../src/notebooks/demo_arrivals.py
          base_parameters:
            bundle_root: ${workspace.file_path}
            catalog: ${var.catalog}
            volume_name: ${var.volume_name}
            action: seed
            stage: ads
            scenario: scenario
        depends_on:
