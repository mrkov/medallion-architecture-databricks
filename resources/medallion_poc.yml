# Generated from ODCS by scripts/generate_bundle_resources.py; do not hand-edit.
resources:
  pipelines:
    ads_source_pipeline:
      name: '[${bundle.target}] ADS contract-driven pipeline'
      catalog: ${var.catalog}
      schema: bronze_ads
      channel: ${var.pipeline_channel}
      serverless: true
      continuous: false
      photon: true
      environment:
        dependencies:
        - open-data-contract-standard==3.2.0
        - sqlglot==27.29.0
      libraries:
      - glob:
          include: ../src/pipelines/ads/**
      configuration:
        poc.bundle_root: ${workspace.file_path}
        poc.catalog: ${var.catalog}
        poc.volume_name: ${var.volume_name}
    crm_source_pipeline:
      name: '[${bundle.target}] CRM contract-driven pipeline'
      catalog: ${var.catalog}
      schema: bronze_crm
      channel: ${var.pipeline_channel}
      serverless: true
      continuous: false
      photon: true
      environment:
        dependencies:
        - open-data-contract-standard==3.2.0
        - sqlglot==27.29.0
      libraries:
      - glob:
          include: ../src/pipelines/crm/**
      configuration:
        poc.bundle_root: ${workspace.file_path}
        poc.catalog: ${var.catalog}
        poc.volume_name: ${var.volume_name}
    erp_source_pipeline:
      name: '[${bundle.target}] ERP contract-driven pipeline'
      catalog: ${var.catalog}
      schema: bronze_erp
      channel: ${var.pipeline_channel}
      serverless: true
      continuous: false
      photon: true
      environment:
        dependencies:
        - open-data-contract-standard==3.2.0
        - sqlglot==27.29.0
      libraries:
      - glob:
          include: ../src/pipelines/erp/**
      configuration:
        poc.bundle_root: ${workspace.file_path}
        poc.catalog: ${var.catalog}
        poc.volume_name: ${var.volume_name}
    gold_pipeline:
      name: '[${bundle.target}] GOLD contract-driven pipeline'
      catalog: ${var.catalog}
      schema: gold_common
      channel: ${var.pipeline_channel}
      serverless: true
      continuous: false
      photon: true
      environment:
        dependencies:
        - open-data-contract-standard==3.2.0
        - sqlglot==27.29.0
      libraries:
      - file:
          path: ../src/pipelines/gold.py
      configuration:
        poc.bundle_root: ${workspace.file_path}
        poc.catalog: ${var.catalog}
        poc.volume_name: ${var.volume_name}
  jobs:
    refresh_gold:
      name: '[${bundle.target}] Gold on Silver changes'
      max_concurrent_runs: 1
      queue:
        enabled: true
      trigger:
        pause_status: ${var.gold_trigger_status}
        table_update:
          condition: ANY_UPDATED
          table_names:
          - ${var.catalog}.silver_ads.ads_campaigns
          - ${var.catalog}.silver_ads.ads_spend
          - ${var.catalog}.silver_crm.crm_contacts
          - ${var.catalog}.silver_erp.erp_customers
          - ${var.catalog}.silver_erp.erp_customers_history
          - ${var.catalog}.silver_erp.erp_order_lines
          - ${var.catalog}.silver_erp.erp_orders
          - ${var.catalog}.silver_erp.erp_products
          wait_after_last_change_seconds: 60
          min_time_between_triggers_seconds: 120
      tasks:
      - task_key: refresh_gold
        pipeline_task:
          pipeline_id: ${resources.pipelines.gold_pipeline.id}
    setup_poc:
      name: '[${bundle.target}] Set up contracts, source interfaces and Platinum views'
      max_concurrent_runs: 1
      tasks:
      - task_key: prepare_storage
        notebook_task:
          notebook_path: ../src/notebooks/setup_poc.py
          base_parameters:
            bundle_root: ${workspace.file_path}
            catalog: ${var.catalog}
            volume_name: ${var.volume_name}
      - task_key: initialize_ads
        pipeline_task:
          pipeline_id: ${resources.pipelines.ads_source_pipeline.id}
        depends_on:
        - task_key: prepare_storage
      - task_key: initialize_crm
        pipeline_task:
          pipeline_id: ${resources.pipelines.crm_source_pipeline.id}
        depends_on:
        - task_key: prepare_storage
      - task_key: initialize_erp
        pipeline_task:
          pipeline_id: ${resources.pipelines.erp_source_pipeline.id}
        depends_on:
        - task_key: prepare_storage
      - task_key: initialize_gold
        pipeline_task:
          pipeline_id: ${resources.pipelines.gold_pipeline.id}
        depends_on:
        - task_key: initialize_ads
        - task_key: initialize_crm
        - task_key: initialize_erp
      - task_key: publish_views
        notebook_task:
          notebook_path: ../src/notebooks/publish_views.py
          base_parameters:
            bundle_root: ${workspace.file_path}
            catalog: ${var.catalog}
            volume_name: ${var.volume_name}
        depends_on:
        - task_key: initialize_gold
    publish_platinum_views:
      name: '[${bundle.target}] Publish contract-defined Platinum views'
      tasks:
      - task_key: publish_views
        notebook_task:
          notebook_path: ../src/notebooks/publish_views.py
          base_parameters:
            bundle_root: ${workspace.file_path}
            catalog: ${var.catalog}
            volume_name: ${var.volume_name}
    ingest_ads:
      name: '[${bundle.target}] Ingest ADS through Silver'
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
      - task_key: ingest_ads
        pipeline_task:
          pipeline_id: ${resources.pipelines.ads_source_pipeline.id}
    ingest_crm:
      name: '[${bundle.target}] Ingest CRM through Silver'
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
      - task_key: ingest_crm
        pipeline_task:
          pipeline_id: ${resources.pipelines.crm_source_pipeline.id}
    ingest_erp:
      name: '[${bundle.target}] Ingest ERP through Silver'
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
      - task_key: ingest_erp
        pipeline_task:
          pipeline_id: ${resources.pipelines.erp_source_pipeline.id}
    medallion_poc_demo:
      name: '[${bundle.target}] Observe automatic Gold enrichment after staged arrivals'
      max_concurrent_runs: 1
      tasks:
      - task_key: seed_erp
        notebook_task:
          notebook_path: ../src/notebooks/demo_arrivals.py
          base_parameters:
            bundle_root: ${workspace.file_path}
            catalog: ${var.catalog}
            volume_name: ${var.volume_name}
            action: seed
            stage: erp
            scenario: scenario
      - task_key: ingest_erp
        run_job_task:
          job_id: ${resources.jobs.ingest_erp.id}
        depends_on:
        - task_key: seed_erp
      - task_key: observe_erp
        notebook_task:
          notebook_path: ../src/notebooks/demo_arrivals.py
          base_parameters:
            bundle_root: ${workspace.file_path}
            catalog: ${var.catalog}
            volume_name: ${var.volume_name}
            action: wait
            stage: erp
            scenario: scenario
        depends_on:
        - task_key: ingest_erp
      - task_key: seed_crm
        notebook_task:
          notebook_path: ../src/notebooks/demo_arrivals.py
          base_parameters:
            bundle_root: ${workspace.file_path}
            catalog: ${var.catalog}
            volume_name: ${var.volume_name}
            action: seed
            stage: crm
            scenario: scenario
        depends_on:
