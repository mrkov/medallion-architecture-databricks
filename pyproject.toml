[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "medallion-architecture-databricks"
version = "0.1.0"
description = "Four-layer Lakeflow Declarative Pipelines POC with executable ODCS contracts"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "open-data-contract-standard==3.2.0",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/medallion_poc"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

