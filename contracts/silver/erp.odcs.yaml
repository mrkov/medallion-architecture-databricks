- name: erp_order_lines
  physicalType: materialized view
  logicalType: object
  dataGranularityDescription: One source record per ERP order-line version.
  properties:
  - name: order_line_id
    logicalType: string
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    physicalType: STRING
    transformLogic: src.order_line_id
    transformSourceObjects:
    - bronze.erp_order_lines
  - name: order_id
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: src.order_id
    transformSourceObjects:
    - bronze.erp_order_lines
  - name: product_id
