  physicalName: <catalog>.silver_erp.erp_order_lines
  customProperties:
  - property: poc
    value:
      inputs:
        raw: bronze.erp_order_lines
      from_sql: '{{ raw }} AS src'
      order_by:
      - updated_at DESC NULLS LAST
      - _ingested_at DESC
      - _source_file DESC
