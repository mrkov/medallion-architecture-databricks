  - name: updated_at
    logicalType: timestamp
    required: true
    physicalType: TIMESTAMP
    transformLogic: src.updated_at
    transformSourceObjects:
    - bronze.erp_order_lines
  - name: _ingested_at
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    transformLogic: src._ingested_at
  - name: _source_file
    logicalType: string
    physicalType: STRING
    required: true
    transformLogic: src._source_file
  - name: _source_system
    logicalType: string
    physicalType: STRING
    required: true
    transformLogic: src._source_system
  - name: _batch_id
    logicalType: string
    physicalType: STRING
    required: true
