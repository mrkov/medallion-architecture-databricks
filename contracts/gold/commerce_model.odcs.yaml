- name: data_readiness
  physicalType: materialized view
  logicalType: object
  dataGranularityDescription: One row per source object.
  properties:
  - name: source_object
    logicalType: string
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    physicalType: STRING
    transformLogic: readiness.source_object
    transformSourceObjects:
    - silver.erp_customers
    - silver.erp_products
    - silver.erp_orders
    - silver.erp_order_lines
    - silver.crm_contacts
    - silver.ads_campaigns
    - silver.ads_spend
  - name: latest_source_timestamp
    logicalType: timestamp
    required: false
    physicalType: TIMESTAMP
    transformLogic: readiness.latest_source_timestamp
    transformSourceObjects:
    - silver.erp_customers
    - silver.erp_products
    - silver.erp_orders
    - silver.erp_order_lines
    - silver.crm_contacts
    - silver.ads_campaigns
    - silver.ads_spend
  - name: latest_ingestion_timestamp
    logicalType: timestamp
    required: false
    physicalType: TIMESTAMP
    transformLogic: readiness.latest_ingestion_timestamp
    transformSourceObjects:
    - silver.erp_customers
    - silver.erp_products
    - silver.erp_orders
    - silver.erp_order_lines
    - silver.crm_contacts
    - silver.ads_campaigns
    - silver.ads_spend
  - name: record_count
    logicalType: integer
    required: true
    physicalType: BIGINT
    transformLogic: readiness.record_count
    transformSourceObjects:
    - silver.erp_customers
    - silver.erp_products
    - silver.erp_orders
    - silver.erp_order_lines
    - silver.crm_contacts
    - silver.ads_campaigns
    - silver.ads_spend
  - name: readiness_status
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: readiness.readiness_status
    transformSourceObjects:
    - silver.erp_customers
    - silver.erp_products
    - silver.erp_orders
    - silver.erp_order_lines
    - silver.crm_contacts
    - silver.ads_campaigns
    - silver.ads_spend
  physicalName: <catalog>.gold_common.data_readiness
  customProperties:
  - property: poc
    value:
      inputs:
        erp_customers: silver.erp_customers
        erp_products: silver.erp_products
        erp_orders: silver.erp_orders
        erp_order_lines: silver.erp_order_lines
        crm_contacts: silver.crm_contacts
        ads_campaigns: silver.ads_campaigns
        ads_spend: silver.ads_spend
      from_sql: |-
        (
        SELECT 'erp_customers' AS source_object, max(updated_at) AS latest_source_timestamp, max(_ingested_at) AS latest_ingestion_timestamp, count(*) AS record_count, CASE WHEN count(*) > 0 THEN 'AVAILABLE' ELSE 'AWAITING_DATA' END AS readiness_status FROM {{ erp_customers }}
        UNION ALL
        SELECT 'erp_products' AS source_object, max(updated_at) AS latest_source_timestamp, max(_ingested_at) AS latest_ingestion_timestamp, count(*) AS record_count, CASE WHEN count(*) > 0 THEN 'AVAILABLE' ELSE 'AWAITING_DATA' END AS readiness_status FROM {{ erp_products }}
        UNION ALL
        SELECT 'erp_orders' AS source_object, max(updated_at) AS latest_source_timestamp, max(_ingested_at) AS latest_ingestion_timestamp, count(*) AS record_count, CASE WHEN count(*) > 0 THEN 'AVAILABLE' ELSE 'AWAITING_DATA' END AS readiness_status FROM {{ erp_orders }}
        UNION ALL
        SELECT 'erp_order_lines' AS source_object, max(updated_at) AS latest_source_timestamp, max(_ingested_at) AS latest_ingestion_timestamp, count(*) AS record_count, CASE WHEN count(*) > 0 THEN 'AVAILABLE' ELSE 'AWAITING_DATA' END AS readiness_status FROM {{ erp_order_lines }}
        UNION ALL
        SELECT 'crm_contacts' AS source_object, max(updated_at) AS latest_source_timestamp, max(_ingested_at) AS latest_ingestion_timestamp, count(*) AS record_count, CASE WHEN count(*) > 0 THEN 'AVAILABLE' ELSE 'AWAITING_DATA' END AS readiness_status FROM {{ crm_contacts }}
        UNION ALL
        SELECT 'ads_campaigns' AS source_object, max(updated_at) AS latest_source_timestamp, max(_ingested_at) AS latest_ingestion_timestamp, count(*) AS record_count, CASE WHEN count(*) > 0 THEN 'AVAILABLE' ELSE 'AWAITING_DATA' END AS readiness_status FROM {{ ads_campaigns }}
        UNION ALL
        SELECT 'ads_spend' AS source_object, max(updated_at) AS latest_source_timestamp, max(_ingested_at) AS latest_ingestion_timestamp, count(*) AS record_count, CASE WHEN count(*) > 0 THEN 'AVAILABLE' ELSE 'AWAITING_DATA' END AS readiness_status FROM {{ ads_spend }}
        ) AS readiness
- name: dim_customer_history
  physicalName: <catalog>.gold_common.dim_customer_history
  physicalType: materialized view
  logicalType: object
  dataGranularityDescription: One row per ERP customer attribute version; validity is [valid_from, valid_to).
  description: SCD Type 2 for ERP customer_number and country_code. CRM enrichment stays in the current dim_customer.
  properties:
  - name: customer_version_key
    logicalType: string
    physicalType: STRING
    required: true
    transformLogic: sha2(concat_ws('|', 'customer_version', src.customer_id, CAST(unix_micros(src.updated_at) AS STRING)),
      256)
    transformSourceObjects:
    - silver.erp_customers_history
    primaryKey: true
    primaryKeyPosition: 1
  - name: customer_key
    logicalType: string
    physicalType: STRING
    required: true
    transformLogic: sha2(concat_ws('|', 'customer', src.customer_id), 256)
    transformSourceObjects:
    - silver.erp_customers_history
  - name: customer_id
    logicalType: string
    physicalType: STRING
    required: true
    transformLogic: src.customer_id
    transformSourceObjects:
    - silver.erp_customers_history
  - name: customer_number
    logicalType: string
    physicalType: STRING
    required: true
    transformLogic: src.customer_number
    transformSourceObjects:
    - silver.erp_customers_history
  - name: country_code
    logicalType: string
    physicalType: STRING
    required: true
    transformLogic: src.country_code
    transformSourceObjects:
    - silver.erp_customers_history
  - name: valid_from
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    transformLogic: src.updated_at
    transformSourceObjects:
    - silver.erp_customers_history
  - name: valid_to
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    transformLogic: lead(src.updated_at) OVER (PARTITION BY src.customer_id ORDER BY src.updated_at)
    transformSourceObjects:
    - silver.erp_customers_history
  - name: is_current
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
