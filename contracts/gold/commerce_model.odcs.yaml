  - name: campaign_code
    logicalType: string
    required: true
    unique: true
    physicalType: STRING
    transformLogic: src.campaign_code
    transformSourceObjects:
    - silver.ads_campaigns
  - name: campaign_name
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: src.campaign_name
    transformSourceObjects:
    - silver.ads_campaigns
  - name: platform
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: src.platform
    transformSourceObjects:
    - silver.ads_campaigns
