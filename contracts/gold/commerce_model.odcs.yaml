  - name: product_id
    logicalType: string
    required: false
    unique: true
    physicalType: STRING
    transformLogic: src.product_id
    transformSourceObjects:
    - silver.erp_products
  - name: product_name
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: src.product_name
    transformSourceObjects:
    - silver.erp_products
  - name: product_family
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: src.product_family
    transformSourceObjects:
    - silver.erp_products
  - name: product_tier
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: src.product_tier
    transformSourceObjects:
    - silver.erp_products
  - name: product_format
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: src.product_format
    transformSourceObjects:
    - silver.erp_products
  - name: product_orientation
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: src.product_orientation
    transformSourceObjects:
    - silver.erp_products
  - name: active
    logicalType: boolean
    required: true
    physicalType: BOOLEAN
    transformLogic: src.active
    transformSourceObjects:
    - silver.erp_products
  physicalName: <catalog>.gold_common.dim_product
  customProperties:
  - property: poc
    value:
      inputs:
        src: silver.erp_products
      from_sql: '{{ src }} AS src'
      unknown_member:
        product_key: poc_key('product', NULL)
        product_id: 'NULL'
        product_name: '''UNKNOWN'''
        product_family: '''UNKNOWN'''
        product_tier: '''UNKNOWN'''
        product_format: '''UNKNOWN'''
        product_orientation: '''UNKNOWN'''
        active: 'false'
      key_checks:
      - key: product_key
        identity:
        - product_id
