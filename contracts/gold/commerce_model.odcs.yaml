- name: fact_sales
  physicalType: materialized view
  logicalType: object
  dataGranularityDescription: One row per ERP order_line_id.
  properties:
  - name: order_line_id
    logicalType: string
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    physicalType: STRING
    transformLogic: line.order_line_id
    transformSourceObjects:
    - silver.erp_order_lines
    - silver.erp_orders
  - name: order_id
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: ord.order_id
    transformSourceObjects:
    - silver.erp_order_lines
    - silver.erp_orders
  - name: order_timestamp
    logicalType: timestamp
    required: true
    physicalType: TIMESTAMP
    transformLogic: ord.order_timestamp
    transformSourceObjects:
    - silver.erp_order_lines
    - silver.erp_orders
  - name: order_date
    logicalType: date
    required: true
    physicalType: DATE
    transformLogic: to_date(ord.order_timestamp)
    transformSourceObjects:
    - silver.erp_order_lines
    - silver.erp_orders
  - name: customer_key
    logicalType: string
    required: true
    physicalType: BINARY
    transformLogic: poc_key('customer', ord.customer_id)
    transformSourceObjects:
    - silver.erp_order_lines
    - silver.erp_orders
  - name: product_key
    logicalType: string
    required: true
    physicalType: BINARY
    transformLogic: poc_key('product', line.product_id)
    transformSourceObjects:
    - silver.erp_order_lines
    - silver.erp_orders
  - name: campaign_code
    logicalType: string
    required: false
    physicalType: STRING
    transformLogic: ord.campaign_code
    transformSourceObjects:
    - silver.erp_order_lines
    - silver.erp_orders
  - name: quantity
    logicalType: integer
    required: true
    physicalType: INT
    transformLogic: line.quantity
    transformSourceObjects:
    - silver.erp_order_lines
    - silver.erp_orders
  - name: unit_price
    logicalType: number
    required: true
    physicalType: DECIMAL(18,2)
    transformLogic: line.unit_price
    transformSourceObjects:
    - silver.erp_order_lines
    - silver.erp_orders
  - name: line_amount
    logicalType: number
    required: true
    semanticType: measure
    physicalType: DECIMAL(18,2)
    transformLogic: line.quantity * line.unit_price
    transformSourceObjects:
    - silver.erp_order_lines
    - silver.erp_orders
  - name: currency_code
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: ord.currency_code
    transformSourceObjects:
    - silver.erp_order_lines
    - silver.erp_orders
  - name: order_status
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: ord.order_status
    transformSourceObjects:
    - silver.erp_order_lines
    - silver.erp_orders
  - name: customer_id
    logicalType: string
    physicalType: STRING
    required: false
    transformLogic: ord.customer_id
    transformSourceObjects:
    - silver.erp_orders
  - name: product_id
    logicalType: string
    physicalType: STRING
    required: false
    transformLogic: line.product_id
    transformSourceObjects:
    - silver.erp_order_lines
  physicalName: <catalog>.gold_common.fact_sales
  customProperties:
  - property: poc
    value:
      inputs:
        line: silver.erp_order_lines
        ord: silver.erp_orders
      from_sql: '{{ line }} AS line JOIN {{ ord }} AS ord ON line.order_id = ord.order_id'
- name: fact_attributed_sales
  physicalType: materialized view
  logicalType: object
  dataGranularityDescription: One attribution row per ERP order_line_id.
  properties:
  - name: order_line_id
    logicalType: string
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    physicalType: STRING
    transformLogic: line.order_line_id
    transformSourceObjects:
    - silver.erp_order_lines
    - silver.erp_orders
    - silver.erp_customers
    - silver.crm_contacts
    - silver.ads_campaigns
  - name: order_id
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: ord.order_id
    transformSourceObjects:
    - silver.erp_order_lines
    - silver.erp_orders
    - silver.erp_customers
    - silver.crm_contacts
    - silver.ads_campaigns
  - name: order_date
    logicalType: date
    required: true
    physicalType: DATE
    transformLogic: to_date(ord.order_timestamp)
    transformSourceObjects:
    - silver.erp_order_lines
    - silver.erp_orders
    - silver.erp_customers
    - silver.crm_contacts
    - silver.ads_campaigns
  - name: customer_key
    logicalType: string
    required: true
    physicalType: BINARY
    transformLogic: poc_key('customer', ord.customer_id)
    transformSourceObjects:
    - silver.erp_order_lines
    - silver.erp_orders
    - silver.erp_customers
    - silver.crm_contacts
    - silver.ads_campaigns
  - name: campaign_key
    logicalType: string
    required: true
    physicalType: BINARY
    transformLogic: poc_key('campaign', ord.campaign_code)
    transformSourceObjects:
    - silver.erp_order_lines
    - silver.erp_orders
    - silver.erp_customers
    - silver.crm_contacts
    - silver.ads_campaigns
  - name: campaign_code
    logicalType: string
    required: false
    physicalType: STRING
    transformLogic: ord.campaign_code
    transformSourceObjects:
    - silver.erp_order_lines
    - silver.erp_orders
    - silver.erp_customers
    - silver.crm_contacts
    - silver.ads_campaigns
  - name: acquisition_channel
    logicalType: string
    required: false
    physicalType: STRING
    transformLogic: crm.acquisition_channel
    transformSourceObjects:
    - silver.erp_order_lines
    - silver.erp_orders
    - silver.erp_customers
    - silver.crm_contacts
    - silver.ads_campaigns
  - name: line_amount
    logicalType: number
    required: true
    semanticType: measure
    physicalType: DECIMAL(18,2)
    transformLogic: line.quantity * line.unit_price
    transformSourceObjects:
    - silver.erp_order_lines
    - silver.erp_orders
    - silver.erp_customers
    - silver.crm_contacts
    - silver.ads_campaigns
  - name: completeness_status
    logicalType: string
    required: true
    enum:
    - value: ERP_ONLY
    - value: CRM_ENRICHED
    - value: COMPLETE
    physicalType: STRING
    transformLogic: CASE WHEN crm.contact_id IS NOT NULL AND campaign.campaign_code IS NOT NULL THEN 'COMPLETE'
      WHEN crm.contact_id IS NOT NULL THEN 'CRM_ENRICHED' ELSE 'ERP_ONLY' END
    transformSourceObjects:
    - silver.erp_order_lines
    - silver.erp_orders
    - silver.erp_customers
    - silver.crm_contacts
    - silver.ads_campaigns
  - name: crm_match_status
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: CASE WHEN crm.contact_id IS NOT NULL THEN 'MATCHED' ELSE 'MISSING' END
    transformSourceObjects:
    - silver.erp_order_lines
    - silver.erp_orders
    - silver.erp_customers
    - silver.crm_contacts
    - silver.ads_campaigns
  - name: campaign_match_status
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: CASE WHEN ord.campaign_code IS NULL THEN 'NOT_PROVIDED' WHEN campaign.campaign_code IS NOT NULL
      THEN 'MATCHED' ELSE 'MISSING' END
    transformSourceObjects:
    - silver.erp_order_lines
    - silver.erp_orders
    - silver.erp_customers
    - silver.crm_contacts
    - silver.ads_campaigns
  - name: latest_source_timestamp
    logicalType: timestamp
    required: true
    physicalType: TIMESTAMP
    transformLogic: greatest(line.updated_at, ord.updated_at, customer.updated_at, crm.updated_at, campaign.updated_at)
    transformSourceObjects:
    - silver.erp_order_lines
    - silver.erp_orders
    - silver.erp_customers
    - silver.crm_contacts
    - silver.ads_campaigns
  - name: customer_id
    logicalType: string
    physicalType: STRING
    required: false
    transformLogic: ord.customer_id
    transformSourceObjects:
    - silver.erp_orders
  - name: order_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    transformLogic: ord.order_timestamp
    transformSourceObjects:
    - silver.erp_orders
  physicalName: <catalog>.gold_common.fact_attributed_sales
  customProperties:
  - property: poc
    value:
      inputs:
        line: silver.erp_order_lines
        ord: silver.erp_orders
        customer: silver.erp_customers
        crm: silver.crm_contacts
        campaign: silver.ads_campaigns
      from_sql: '{{ line }} AS line JOIN {{ ord }} AS ord ON line.order_id = ord.order_id LEFT JOIN {{ customer
        }} AS customer ON ord.customer_id = customer.customer_id LEFT JOIN (SELECT * FROM (SELECT *, row_number()
        OVER (PARTITION BY erp_customer_id ORDER BY updated_at DESC, _ingested_at DESC, _source_file DESC, contact_id
        DESC) AS contact_rank FROM {{ crm }}) WHERE contact_rank = 1) AS crm ON customer.customer_id = crm.erp_customer_id
        LEFT JOIN {{ campaign }} AS campaign ON ord.campaign_code = campaign.campaign_code'
