    primaryKeyPosition: 1
    physicalType: STRING
    transformLogic: sha2(concat_ws('|', 'product', src.product_id), 256)
    transformSourceObjects:
    - silver.erp_products
  - name: product_id
    logicalType: string
    required: true
    unique: true
    physicalType: STRING
    transformLogic: src.product_id
    transformSourceObjects:
    - silver.erp_products
  - name: product_name
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: src.product_name
    transformSourceObjects:
    - silver.erp_products
  - name: product_family
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: src.product_family
    transformSourceObjects:
    - silver.erp_products
  - name: product_tier
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: src.product_tier
    transformSourceObjects:
    - silver.erp_products
  - name: product_format
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: src.product_format
    transformSourceObjects:
    - silver.erp_products
  - name: product_orientation
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: src.product_orientation
    transformSourceObjects:
    - silver.erp_products
  - name: active
    logicalType: boolean
    required: true
    physicalType: BOOLEAN
    transformLogic: src.active
    transformSourceObjects:
    - silver.erp_products
  physicalName: <catalog>.gold_common.dim_product
  customProperties:
