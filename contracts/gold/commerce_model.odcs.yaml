apiVersion: v3.2.0
kind: DataContract
id: 94da63f7-f9fc-4595-8823-aa27ccb16fe9
name: gold_commerce_model
version: 2.1.0
status: active
domain: commerce
description:
  purpose: Conformed facts and dimensions for sales and marketing analysis.
  usage: Stable Gold interfaces sourced directly from Silver tables.
  limitations: Attribution remains explicitly incomplete until CRM and advertising data arrive.
team:
  name: analytics-engineering
  members:
  - username: analytics-owner
    role: Data Product Owner
slaProperties:
- property: frequency
  value: 5
  unit: minutes
- property: latency
  value: 15
  unit: minutes
schema:
- name: dim_customer
  physicalType: materialized view
  logicalType: object
  dataGranularityDescription: One current row per ERP customer_id.
  properties:
  - name: customer_key
    logicalType: string
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    physicalType: STRING
    transformLogic: sha2(concat_ws('|', 'customer', customer.customer_id), 256)
    transformSourceObjects:
    - silver.erp_customers
    - silver.crm_contacts
  - name: customer_id
    logicalType: string
    required: true
    unique: true
    physicalType: STRING
    transformLogic: customer.customer_id
    transformSourceObjects:
    - silver.erp_customers
    - silver.crm_contacts
  - name: customer_number
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: customer.customer_number
    transformSourceObjects:
    - silver.erp_customers
    - silver.crm_contacts
  - name: country_code
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: customer.country_code
    transformSourceObjects:
    - silver.erp_customers
    - silver.crm_contacts
  - name: crm_contact_id
    logicalType: string
    required: false
    physicalType: STRING
    transformLogic: crm.contact_id
    transformSourceObjects:
    - silver.erp_customers
    - silver.crm_contacts
  - name: email
    logicalType: string
    required: false
    classification: confidential
    physicalType: STRING
    transformLogic: crm.email
    transformSourceObjects:
    - silver.erp_customers
    - silver.crm_contacts
  - name: marketing_consent
    logicalType: boolean
    required: false
    physicalType: BOOLEAN
    transformLogic: crm.marketing_consent
    transformSourceObjects:
    - silver.erp_customers
    - silver.crm_contacts
  - name: acquisition_channel
    logicalType: string
    required: false
    physicalType: STRING
    transformLogic: crm.acquisition_channel
    transformSourceObjects:
    - silver.erp_customers
    - silver.crm_contacts
  - name: enrichment_status
    logicalType: string
    required: true
    enum:
    - value: ERP_ONLY
    - value: CRM_ENRICHED
    physicalType: STRING
    transformLogic: CASE WHEN crm.contact_id IS NOT NULL THEN 'CRM_ENRICHED' ELSE 'ERP_ONLY' END
    transformSourceObjects:
    - silver.erp_customers
    - silver.crm_contacts
  physicalName: <catalog>.gold_common.dim_customer
  customProperties:
  - property: poc
    value:
      inputs:
        customer: silver.erp_customers
        crm: silver.crm_contacts
      from_sql: '{{ customer }} AS customer LEFT JOIN (SELECT * FROM (SELECT *, row_number() OVER (PARTITION BY erp_customer_id
        ORDER BY updated_at DESC, _ingested_at DESC, _source_file DESC, contact_id DESC) AS contact_rank FROM {{ crm }}) WHERE
        contact_rank = 1) AS crm ON customer.customer_id = crm.erp_customer_id'
- name: dim_product
  physicalType: materialized view
  logicalType: object
  dataGranularityDescription: One current row per ERP product_id.
  properties:
  - name: product_key
