apiVersion: v3.2.0
kind: DataContract
id: 7d3f83ab-8167-4a6a-9b21-1f345713a39d
name: erp_source_files
version: 3.0.0
status: active
domain: commerce
customProperties:
- property: source_system
  value: erp
description:
  purpose: Raw ERP interfaces for customers, products, orders, and order lines.
  usage: Append-only ingestion into the Bronze ERP schema.
  limitations: Every source field is represented as a string at the Bronze boundary.
team:
  name: commerce-data
  members:
  - username: commerce-owner
    role: Data Product Owner
schema:
- name: erp_customers
  physicalType: file
  logicalType: object
  dataGranularityDescription: One source record per ERP customer version.
  properties:
  - name: customer_id
    logicalType: string
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    physicalType: STRING
  - name: customer_number
    logicalType: string
    required: true
    physicalType: STRING
  - name: country_code
    logicalType: string
    required: true
    physicalType: STRING
  - name: created_at
    logicalType: string
    required: true
    physicalType: STRING
  - name: updated_at
    logicalType: string
    required: true
    physicalType: STRING
  physicalName: <catalog>.bronze_erp.erp_customers
  customProperties:
  - property: poc
    value:
      demo_rows:
      - customer_id: C100
        customer_number: CUST-100
        country_code: CH
        created_at: '2026-10-01T09:00:00Z'
        updated_at: '2026-10-01T09:00:00Z'
      demo_batches:
        scd2_initial:
        - customer_id: C_SCD2
          customer_number: CUST-SCD2
          country_code: CH
          created_at: '2026-10-01T09:00:00Z'
          updated_at: '2026-10-01T09:00:00Z'
        scd2_move:
        - customer_id: C_SCD2
          customer_number: CUST-SCD2
          country_code: DE
          created_at: '2026-10-01T09:00:00Z'
          updated_at: '2026-10-03T00:00:00Z'
        scd2_repeat:
        - customer_id: C_SCD2
          customer_number: CUST-SCD2
          country_code: DE
          created_at: '2026-10-01T09:00:00Z'
          updated_at: '2026-10-04T00:00:00Z'
        scd2_late:
        - customer_id: C_SCD2
          customer_number: CUST-SCD2
          country_code: AT
          created_at: '2026-10-01T09:00:00Z'
          updated_at: '2026-10-02T00:00:00Z'
        keys_late:
        - customer_id: C_KEY_LATE
          customer_number: CUST-KEY-LATE
          country_code: CH
          created_at: '2026-10-01T00:00:00Z'
          updated_at: '2026-10-01T00:00:00Z'
- name: erp_products
  physicalType: file
  logicalType: object
  dataGranularityDescription: One source record per ERP product version.
  properties:
  - name: product_id
    logicalType: string
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    physicalType: STRING
  - name: product_name
    logicalType: string
    required: true
    physicalType: STRING
  - name: product_hierarchy
    logicalType: string
    required: true
    description: Pipe-delimited family, tier, format, and orientation.
    examples:
    - PHOTOBOOK|PREMIUM|A4|LANDSCAPE
    logicalTypeOptions:
      pattern: ^[^|]+\|[^|]+\|[^|]+\|[^|]+$
    physicalType: STRING
  - name: active_flag
    logicalType: string
    required: true
    physicalType: STRING
  - name: updated_at
    logicalType: string
    required: true
    physicalType: STRING
  physicalName: <catalog>.bronze_erp.erp_products
  customProperties:
  - property: poc
    value:
      demo_rows:
      - product_id: P100
        product_name: Premium Photo Book
        product_hierarchy: PHOTOBOOK|PREMIUM|A4|LANDSCAPE
        active_flag: 'true'
        updated_at: '2026-10-01T09:00:00Z'
      - product_id: P_BAD
        product_name: Broken Hierarchy
        product_hierarchy: PHOTOBOOK|PREMIUM|A4
        active_flag: 'true'
        updated_at: '2026-10-01T09:00:00Z'
      demo_batches:
        scd2_initial:
        - product_id: P_SCD2
          product_name: SCD2 Photo Book
          product_hierarchy: PHOTOBOOK|PREMIUM|A4|LANDSCAPE
          active_flag: 'true'
          updated_at: '2026-10-01T09:00:00Z'
        keys_late:
        - product_id: P_KEY_LATE
          product_name: Late Photo Book
          product_hierarchy: PHOTOBOOK|PREMIUM|A4|LANDSCAPE
          active_flag: 'true'
          updated_at: '2026-10-01T00:00:00Z'
