apiVersion: v3.2.0
kind: DataContract
id: 58d61b9c-e987-45dd-9cb3-fe1ab9368736
name: platinum_sales_mart
version: 4.0.0
status: active
domain: sales
description:
  purpose: Sales data mart containing an order-line fact, virtual dimensions, and a flattened sales report.
  usage: Semantic models, dashboards, and analytical queries.
  limitations: sales_detail uses current descriptions; sales_history resolves effective-time customer versions in
    Platinum. Missing values map to UNKNOWN; known unmatched IDs retain their entity keys.
team:
  name: analytics-engineering
  members:
  - username: sales-analytics-owner
    role: Data Product Owner
slaProperties:
- property: frequency
  value: 5
  unit: minutes
schema:
- name: sales_detail
  physicalName: <catalog>.platinum_sales.sales_detail
  physicalType: view
  logicalType: object
  dataGranularityDescription: One row per ERP order_line_id.
  properties:
  - name: order_line_id
    logicalType: string
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    physicalType: STRING
    transformLogic: sales.order_line_id
    transformSourceObjects:
    - gold.fact_sales
    - gold.dim_customer
    - gold.dim_product
  - name: order_id
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: sales.order_id
    transformSourceObjects:
    - gold.fact_sales
    - gold.dim_customer
    - gold.dim_product
  - name: order_date
    logicalType: date
    required: true
    semanticType: dimension
    physicalType: DATE
    transformLogic: sales.order_date
    transformSourceObjects:
    - gold.fact_sales
    - gold.dim_customer
    - gold.dim_product
  - name: customer_number
    logicalType: string
    required: false
    semanticType: dimension
    physicalType: STRING
    transformLogic: customer.customer_number
    transformSourceObjects:
    - gold.fact_sales
    - gold.dim_customer
    - gold.dim_product
  - name: country_code
    logicalType: string
    required: false
    semanticType: dimension
    physicalType: STRING
    transformLogic: customer.country_code
    transformSourceObjects:
    - gold.fact_sales
    - gold.dim_customer
    - gold.dim_product
  - name: product_name
    logicalType: string
    required: false
    semanticType: dimension
    physicalType: STRING
    transformLogic: product.product_name
    transformSourceObjects:
    - gold.fact_sales
    - gold.dim_customer
    - gold.dim_product
  - name: product_family
    logicalType: string
    required: false
    semanticType: dimension
    physicalType: STRING
    transformLogic: product.product_family
    transformSourceObjects:
    - gold.fact_sales
    - gold.dim_customer
    - gold.dim_product
  - name: product_tier
    logicalType: string
    required: false
    semanticType: dimension
    physicalType: STRING
    transformLogic: product.product_tier
    transformSourceObjects:
    - gold.fact_sales
    - gold.dim_customer
    - gold.dim_product
  - name: quantity
    logicalType: integer
    required: true
    semanticType: measure
    physicalType: INT
    transformLogic: sales.quantity
    transformSourceObjects:
    - gold.fact_sales
    - gold.dim_customer
    - gold.dim_product
  - name: line_amount
    logicalType: number
    required: true
    semanticType: measure
    physicalType: DECIMAL(18,2)
    transformLogic: sales.line_amount
    transformSourceObjects:
    - gold.fact_sales
    - gold.dim_customer
    - gold.dim_product
  - name: currency_code
    logicalType: string
    required: true
    semanticType: dimension
    physicalType: STRING
    transformLogic: sales.currency_code
    transformSourceObjects:
    - gold.fact_sales
    - gold.dim_customer
    - gold.dim_product
  - name: customer_status
    logicalType: string
    physicalType: STRING
    required: true
    transformLogic: CASE WHEN sales.customer_id IS NULL THEN 'UNKNOWN' WHEN customer.customer_key IS NULL THEN 'UNMATCHED'
      ELSE 'MATCHED' END
    transformSourceObjects:
    - gold.fact_sales
    - gold.dim_customer
  - name: product_status
    logicalType: string
    physicalType: STRING
    required: true
    transformLogic: CASE WHEN sales.product_id IS NULL THEN 'UNKNOWN' WHEN product.product_key IS NULL THEN 'UNMATCHED'
      ELSE 'MATCHED' END
    transformSourceObjects:
    - gold.fact_sales
    - gold.dim_product
  customProperties:
  - property: poc
    value:
      inputs:
        sales: gold.fact_sales
        customer: gold.dim_customer
        product: gold.dim_product
      from_sql: '{{ sales }} AS sales LEFT JOIN {{ customer }} AS customer ON sales.customer_key = customer.customer_key
        LEFT JOIN {{ product }} AS product ON sales.product_key = product.product_key'
- name: fact_sales
  physicalName: <catalog>.platinum_sales.fact_sales
  physicalType: view
  logicalType: object
  description: Contract-defined ordinary SQL view over Gold.
  dataGranularityDescription: One row per ERP order_line_id.
  properties:
  - name: order_line_id
    logicalType: string
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    physicalType: STRING
    transformLogic: src.order_line_id
    transformSourceObjects:
    - gold.fact_sales
  - name: order_id
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: src.order_id
    transformSourceObjects:
    - gold.fact_sales
  - name: order_timestamp
    logicalType: timestamp
    required: true
    physicalType: TIMESTAMP
    transformLogic: src.order_timestamp
    transformSourceObjects:
    - gold.fact_sales
  - name: order_date
    logicalType: date
    required: true
    physicalType: DATE
    transformLogic: src.order_date
    transformSourceObjects:
    - gold.fact_sales
  - name: customer_key
    logicalType: string
    required: true
    physicalType: BINARY
    transformLogic: src.customer_key
    transformSourceObjects:
    - gold.fact_sales
  - name: product_key
    logicalType: string
    required: true
    physicalType: BINARY
    transformLogic: src.product_key
    transformSourceObjects:
    - gold.fact_sales
  - name: campaign_code
    logicalType: string
    required: false
    physicalType: STRING
    transformLogic: src.campaign_code
    transformSourceObjects:
    - gold.fact_sales
  - name: quantity
    logicalType: integer
    required: true
    physicalType: INT
    transformLogic: src.quantity
    transformSourceObjects:
    - gold.fact_sales
  - name: unit_price
    logicalType: number
    required: true
    physicalType: DECIMAL(18,2)
    transformLogic: src.unit_price
    transformSourceObjects:
    - gold.fact_sales
  - name: line_amount
    logicalType: number
    required: true
    semanticType: measure
    physicalType: DECIMAL(18,2)
    transformLogic: src.line_amount
    transformSourceObjects:
    - gold.fact_sales
  - name: currency_code
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: src.currency_code
    transformSourceObjects:
    - gold.fact_sales
  - name: order_status
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: src.order_status
    transformSourceObjects:
    - gold.fact_sales
  - name: customer_id
    logicalType: string
    physicalType: STRING
    required: false
    transformLogic: src.customer_id
    transformSourceObjects:
    - gold.fact_sales
  - name: product_id
    logicalType: string
    physicalType: STRING
    required: false
    transformLogic: src.product_id
    transformSourceObjects:
    - gold.fact_sales
  customProperties:
  - property: poc
    value:
      inputs:
        src: gold.fact_sales
      from_sql: '{{ src }} AS src'
- name: dim_customer
  physicalName: <catalog>.platinum_sales.dim_customer
  physicalType: view
  logicalType: object
  description: Contract-defined ordinary SQL view over Gold.
  dataGranularityDescription: One current row per ERP customer_id.
  properties:
  - name: customer_key
    logicalType: string
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    physicalType: BINARY
    transformLogic: src.customer_key
    transformSourceObjects:
    - gold.dim_customer
  - name: customer_id
    logicalType: string
    required: false
    unique: true
    physicalType: STRING
    transformLogic: src.customer_id
    transformSourceObjects:
    - gold.dim_customer
  - name: customer_number
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: src.customer_number
    transformSourceObjects:
    - gold.dim_customer
  - name: country_code
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: src.country_code
    transformSourceObjects:
    - gold.dim_customer
  - name: crm_contact_id
    logicalType: string
    required: false
    physicalType: STRING
    transformLogic: src.crm_contact_id
    transformSourceObjects:
    - gold.dim_customer
  - name: email
    logicalType: string
    required: false
    classification: confidential
    physicalType: STRING
    transformLogic: src.email
    transformSourceObjects:
    - gold.dim_customer
  - name: marketing_consent
    logicalType: boolean
    required: false
    physicalType: BOOLEAN
    transformLogic: src.marketing_consent
    transformSourceObjects:
    - gold.dim_customer
  - name: acquisition_channel
    logicalType: string
    required: false
    physicalType: STRING
    transformLogic: src.acquisition_channel
    transformSourceObjects:
    - gold.dim_customer
  - name: enrichment_status
    logicalType: string
    required: true
    enum:
    - value: ERP_ONLY
    - value: CRM_ENRICHED
    - value: UNKNOWN
    physicalType: STRING
    transformLogic: src.enrichment_status
    transformSourceObjects:
    - gold.dim_customer
  customProperties:
  - property: poc
    value:
      inputs:
        src: gold.dim_customer
      from_sql: '{{ src }} AS src'
- name: dim_product
  physicalName: <catalog>.platinum_sales.dim_product
  physicalType: view
  logicalType: object
  description: Contract-defined ordinary SQL view over Gold.
  dataGranularityDescription: One current row per ERP product_id.
  properties:
  - name: product_key
    logicalType: string
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    physicalType: BINARY
    transformLogic: src.product_key
    transformSourceObjects:
    - gold.dim_product
  - name: product_id
    logicalType: string
    required: false
    unique: true
    physicalType: STRING
    transformLogic: src.product_id
    transformSourceObjects:
    - gold.dim_product
  - name: product_name
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: src.product_name
    transformSourceObjects:
    - gold.dim_product
  - name: product_family
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: src.product_family
    transformSourceObjects:
    - gold.dim_product
  - name: product_tier
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: src.product_tier
    transformSourceObjects:
    - gold.dim_product
  - name: product_format
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: src.product_format
    transformSourceObjects:
    - gold.dim_product
  - name: product_orientation
    logicalType: string
    required: true
    physicalType: STRING
    transformLogic: src.product_orientation
    transformSourceObjects:
    - gold.dim_product
  - name: active
    logicalType: boolean
    required: true
    physicalType: BOOLEAN
    transformLogic: src.active
    transformSourceObjects:
    - gold.dim_product
  customProperties:
  - property: poc
    value:
      inputs:
        src: gold.dim_product
      from_sql: '{{ src }} AS src'
- name: dim_customer_history
  physicalName: <catalog>.platinum_sales.dim_customer_history
  physicalType: view
  logicalType: object
  dataGranularityDescription: One row per ERP customer attribute version; validity is [valid_from, valid_to).
  description: SCD Type 2 for ERP customer_number and country_code. CRM enrichment stays in the current dim_customer.
  properties:
  - name: customer_version_key
    logicalType: string
    physicalType: BINARY
    required: true
    transformLogic: src.customer_version_key
    transformSourceObjects:
    - gold.dim_customer_history
    primaryKey: true
    primaryKeyPosition: 1
  - name: customer_key
    logicalType: string
    physicalType: BINARY
    required: true
    transformLogic: src.customer_key
    transformSourceObjects:
    - gold.dim_customer_history
  - name: customer_id
    logicalType: string
    physicalType: STRING
    required: false
    transformLogic: src.customer_id
    transformSourceObjects:
    - gold.dim_customer_history
  - name: customer_number
    logicalType: string
    physicalType: STRING
    required: true
    transformLogic: src.customer_number
    transformSourceObjects:
    - gold.dim_customer_history
  - name: country_code
    logicalType: string
    physicalType: STRING
    required: true
    transformLogic: src.country_code
    transformSourceObjects:
    - gold.dim_customer_history
  - name: valid_from
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    transformLogic: src.valid_from
    transformSourceObjects:
    - gold.dim_customer_history
  - name: valid_to
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    transformLogic: src.valid_to
    transformSourceObjects:
    - gold.dim_customer_history
  - name: is_current
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    transformLogic: src.is_current
    transformSourceObjects:
    - gold.dim_customer_history
  customProperties:
  - property: poc
    value:
      inputs:
        src: gold.dim_customer_history
      from_sql: '{{ src }} AS src'
- name: sales_history
  physicalName: <catalog>.platinum_sales.sales_history
  physicalType: view
  logicalType: object
  dataGranularityDescription: One row per ERP order_line_id, with customer attributes valid at the order timestamp.
  properties:
  - name: order_line_id
    logicalType: string
    physicalType: STRING
    required: true
    transformLogic: sales.order_line_id
    transformSourceObjects:
    - gold.fact_sales
    primaryKey: true
    primaryKeyPosition: 1
  - name: order_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    transformLogic: sales.order_timestamp
    transformSourceObjects:
    - gold.fact_sales
  - name: customer_key
    logicalType: string
    physicalType: BINARY
    required: true
    transformLogic: sales.customer_key
    transformSourceObjects:
    - gold.fact_sales
  - name: customer_version_key
    logicalType: string
    physicalType: BINARY
    required: false
    transformLogic: history.customer_version_key
    transformSourceObjects:
    - gold.dim_customer_history
  - name: customer_id
    logicalType: string
    physicalType: STRING
    required: false
    transformLogic: sales.customer_id
    transformSourceObjects:
    - gold.fact_sales
  - name: customer_number_at_order
    logicalType: string
    physicalType: STRING
    required: false
    transformLogic: history.customer_number
    transformSourceObjects:
    - gold.dim_customer_history
  - name: country_code_at_order
    logicalType: string
    physicalType: STRING
    required: false
    transformLogic: history.country_code
    transformSourceObjects:
    - gold.dim_customer_history
  - name: customer_history_status
    logicalType: string
    physicalType: STRING
    required: true
    transformLogic: CASE WHEN sales.customer_id IS NULL THEN 'UNKNOWN' WHEN history.customer_version_key IS NULL
      THEN 'MISSING_HISTORY' ELSE 'MATCHED' END
    transformSourceObjects:
    - gold.fact_sales
    - gold.dim_customer_history
  - name: line_amount
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: true
    transformLogic: sales.line_amount
    transformSourceObjects:
    - gold.fact_sales
  - name: currency_code
    logicalType: string
    physicalType: STRING
    required: true
    transformLogic: sales.currency_code
    transformSourceObjects:
    - gold.fact_sales
  customProperties:
  - property: poc
    value:
      inputs:
        sales: gold.fact_sales
        history: gold.dim_customer_history
      from_sql: '{{ sales }} AS sales LEFT JOIN {{ history }} AS history ON sales.customer_key = history.customer_key
        AND (sales.customer_id IS NULL OR (sales.order_timestamp >= history.valid_from AND (sales.order_timestamp
        < history.valid_to OR history.valid_to IS NULL)))'
